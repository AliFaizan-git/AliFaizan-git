<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="798" height="128" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- ping ripple -->
  <circle cx="46" cy="65" r="6" fill="none" stroke="#3fb950" stroke-width="2">
    <animate attributeName="r" values="6;22" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <!-- solid dot -->
  <circle cx="46" cy="65" r="6" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.6;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <text x="72" y="52" font-family="JetBrains Mono, Consolas, monospace" font-size="20" font-weight="700" fill="#3fb950">SYSTEM STATUS: ONLINE</text>
  <text x="72" y="76" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#8b949e">ali-faizan // junior-devops-engineer // last deploy: continuous</text>

  <text x="72" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#58a6ff">uptime:</text>
  <text x="135" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#c9d1d9">~5 months on the devops track</text>

  <!-- scanning bar -->
  <rect x="600" y="20" width="2" height="90" fill="#3fb950" opacity="0.6">
    <animate attributeName="x" values="600;780;600" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="112" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#484f58">monitoring active</text>
</svg>
